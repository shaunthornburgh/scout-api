services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scout}
      POSTGRES_DB: ${POSTGRES_DB:-scout}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scout} -d ${POSTGRES_DB:-scout}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://scout:scout@db:5432/scout}
      API_KEY: ${API_KEY}
      ENV: ${ENV:-development}
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-scout}
      DB_NAME: ${POSTGRES_DB:-scout}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source for live reload during development
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data: